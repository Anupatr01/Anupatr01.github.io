<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สุภาษิต: ยื่นหมูยื่นแมว</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
    <main class="max-w-3xl mx-auto py-10 px-4">
        <article class="bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-100">
            <div class="bg-teal-600 p-8 text-white text-center">
                <span class="text-teal-100 font-medium mb-2 block uppercase tracking-widest text-sm">การเจรจา</span>
                <h2 class="text-4xl font-extrabold">ยื่นหมูยื่นแมว</h2>
            </div>
            <div class="p-8 space-y-8">
                <section>
                    <div class="flex items-center gap-2 text-slate-400 mb-3">
                        <i data-lucide="info" class="w-4 h-4"></i>
                        <span class="text-sm font-semibold uppercase tracking-wider">ความหมาย</span>
                    </div>
                    <p class="text-xl leading-relaxed text-slate-700 font-medium">
                        การแลกเปลี่ยนสิ่งของหรือผลประโยชน์โดยที่ทั้งสองฝ่ายส่งมอบให้กันพร้อมๆ กัน
                    </p>
                </section>
                <section class="bg-slate-50 p-6 rounded-2xl border-l-4 border-teal-500">
                    <div class="flex items-center gap-2 text-slate-400 mb-3">
                        <i data-lucide="lightbulb" class="w-4 h-4"></i>
                        <span class="text-sm font-semibold uppercase tracking-wider">ตัวอย่างการใช้งาน</span>
                    </div>
                    <p class="text-lg italic text-slate-600">
                        "ข้อตกลงครั้งนี้เราขอแบบยื่นหมูยื่นแมว จ่ายเงินปุ๊บรับของปั๊บเพื่อความสบายใจ"
                    </p>
                </section>
                <!-- <section class="mt-8 pt-6 border-t border-slate-100">
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <div class="flex items-center gap-2 text-slate-500 mb-2">
                            <i data-lucide="qr-code" class="w-4 h-4"></i>
                            <span class="text-xs font-bold uppercase">ลิงก์สำหรับสร้าง QR Code ของหน้านี้:</span>
                        </div>
                        <div class="bg-white p-3 rounded border border-slate-200 text-[11px] break-all text-blue-600 font-mono" id="current-url"></div>
                    </div>
                </section> -->
            </div>
        </article>
    </main>
    <script>
        lucide.createIcons();
        window.onload = function() { document.getElementById('current-url').innerText = window.location.href; };
    </script>
</body>
</html>
