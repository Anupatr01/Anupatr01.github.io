<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สุภาษิต: คาหนัง คาเขา</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
    <main class="max-w-3xl mx-auto py-10 px-4">
        <article class="bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-100">
            <div class="bg-slate-700 p-8 text-white text-center">
                <span class="text-slate-100 font-medium mb-2 block uppercase tracking-widest text-sm">ความผิด</span>
                <h2 class="text-4xl font-extrabold">คาหนัง คาเขา</h2>
            </div>
            
            <div class="p-8 space-y-8">
                <section>
                    <div class="flex items-center gap-2 text-slate-400 mb-3">
                        <i data-lucide="info" class="w-4 h-4"></i>
                        <span class="text-sm font-semibold uppercase tracking-wider">ความหมาย</span>
                    </div>
                    <p class="text-xl leading-relaxed text-slate-700 font-medium">
                        จับผิดได้ในขณะที่กำลังทำความผิดอยู่ พร้อมด้วยหลักฐานมัดตัวแน่นหนา
                    </p>
                </section>

                <section class="bg-slate-50 p-6 rounded-2xl border-l-4 border-slate-500">
                    <div class="flex items-center gap-2 text-slate-400 mb-3">
                        <i data-lucide="lightbulb" class="w-4 h-4"></i>
                        <span class="text-sm font-semibold uppercase tracking-wider">ตัวอย่างการใช้งาน</span>
                    </div>
                    <p class="text-lg italic text-slate-600">
                        "ขโมยถูกตำรวจจับได้คาหนังคาเขาพร้อมกับของกลางในกระเป๋า"
                    </p>
                </section>

                <!-- ส่วนแสดงลิงก์สำหรับสร้าง QR Code -->
                <!-- <section class="mt-8 pt-6 border-t border-slate-100">
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <div class="flex items-center gap-2 text-slate-500 mb-2">
                            <i data-lucide="qr-code" class="w-4 h-4"></i>
                            <span class="text-xs font-bold uppercase">ลิงก์สำหรับสร้าง QR Code ของหน้านี้:</span>
                        </div>
                        <div class="bg-white p-3 rounded border border-slate-200 text-[11px] break-all text-blue-600 font-mono" id="current-url">
                        </div>
                        <p class="mt-2 text-[10px] text-slate-400 italic text-center leading-relaxed">
                            * หากคุณนำไฟล์นี้ไปขึ้นโฮสติ้งจริง ลิงก์ด้านบนจะเปลี่ยนเป็นที่อยู่เว็บไซต์จริงของคุณ
                        </p>
                    </div>
                </section> -->
            </div>
        </article>
    </main>

    <script>
        // เริ่มต้นใช้งาน Lucide Icons
        lucide.createIcons();

        // แสดง URL ปัจจุบันของหน้าเว็บ
        window.onload = function() {
            const urlDisplay = document.getElementById('current-url');
            urlDisplay.innerText = window.location.href;
        };
    </script>
</body>
</html>
